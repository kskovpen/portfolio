  fr: ["Quatre et trois quarks top produits ensemble à CMS", "Neutrinos lourds et nouveaux détecteurs de muons pour CMS", "Quarks top avec un boson Z, et nouveaux détecteurs pour CMS", "Développement de détecteurs pour SHiP", "Un calorimètre qui mesure précisément les angles, pour SHiP", "Des détecteurs pour les rayons cosmiques, la radioactivité et même l'humidité des sols"]
  nl: ["Vier en drie top-quarks die samen ontstaan bij CMS", "Zware neutrino's en nieuwe muondetectoren voor CMS", "Top-quarks met een Z-boson, en nieuwe detectoren voor CMS", "Detectorontwikkeling voor SHiP", "Een calorimeter die hoeken nauwkeurig meet, voor SHiP", "Detectoren voor kosmische straling, radioactiviteit en zelfs bodemvocht"]
  ru: ["Рождение четырёх и трёх топ-кварков в CMS", "Тяжёлые нейтрино и новые мюонные детекторы для CMS", "Топ-кварки с Z-бозоном и новые детекторы для CMS", "Разработка детекторов для SHiP", "Калориметр, точно измеряющий углы, для SHiP", "Детекторы космических лучей, радиации и даже влажности почвы"]
schools:
