    place: "Heimbach, Germany"
    url: https://indico.global/event/17239/
    text: {en: "Invited lecturer and student project", fr: "Conférencier invité et projet étudiant", nl: "Gastdocent en studentenproject", ru: "Приглашённый лектор и студенческий проект"}
    lectures:
      - title: "Physics on target: Structure of matter"
        image: images/lectures/bnd2026-target-1.jpg
        url: https://indico.global/event/17239/contributions/164021/attachments/75952/147421/LectureFT1.pdf
        about: {en: "What experiments that shoot beams at a fixed target teach us about the inside of matter", fr: "Ce que les expériences sur cible fixe nous apprennent sur l'intérieur de la matière", nl: "Wat experimenten met een vast doelwit ons leren over de binnenkant van materie", ru: "Что эксперименты на фиксированной мишени рассказывают о строении материи"}
      - title: "Physics on target: Rare processes and hidden sectors"
        image: images/lectures/bnd2026-target-2.jpg
        url: https://indico.global/event/17239/contributions/164022/attachments/75953/147424/LectureFT2.pdf
        about: {en: "Hunting rare processes and hidden particles, as SHiP will do", fr: "Traquer des processus rares et des particules cachées, comme le fera SHiP", nl: "Jagen op zeldzame processen en verborgen deeltjes, zoals SHiP zal doen", ru: "Поиск редких процессов и скрытых частиц — как это будет делать SHiP"}
      - title: "Forging top quarks"
        image: images/lectures/bnd2026-top.jpg
        url: https://indico.global/event/17239/contributions/164023/attachments/76022/147538/LectureTop.pdf
        about: {en: "How the heaviest particle is made and studied at the LHC", fr: "Comment la particule la plus lourde est produite et étudiée au LHC", nl: "Hoe het zwaarste deeltje wordt gemaakt en bestudeerd bij de LHC", ru: "Как самую тяжёлую частицу рождают и изучают на БАК"}
      - title: "Towards a future collider"
        image: images/lectures/bnd2026-future-collider.jpg
        url: https://indico.global/event/17239/contributions/164027/attachments/75991/147572/FutureColliders.pdf
        about: {en: "Student project with an advanced and improved FCE studio: designing measurements for a future collider", fr: "Projet étudiant avec une version avancée et améliorée de FCE : concevoir des mesures pour un futur collisionneur", nl: "Studentenproject met een geavanceerde en verbeterde FCE-studio: metingen ontwerpen voor een toekomstige versneller", ru: "Студенческий проект с расширенной и улучшенной версией FCE: планирование измерений на будущем коллайдере"}
