    text: {en: "Projects with students at AstroLAB IRIS, the public observatory in Ypres: building detectors that catch cosmic muons, particles from space that rain down on us all the time", fr: "Des projets avec des étudiants à AstroLAB IRIS, l'observatoire public d'Ypres : construire des détecteurs qui captent les muons cosmiques, des particules venues de l'espace qui nous tombent dessus en permanence", nl: "Projecten met studenten bij AstroLAB IRIS, de volkssterrenwacht in Ieper: detectoren bouwen die kosmische muonen opvangen, deeltjes uit de ruimte die voortdurend op ons neerregenen", ru: "Проекты со студентами в AstroLAB IRIS — народной обсерватории в Ипре: создаём детекторы, которые ловят космические мюоны — частицы из космоса, постоянно падающие на нас"}
  - year: "2025"
    link: https://arxiv.org/abs/2509.17643
    text: {en: "Co-author of the paper describing IPPOG, the International Particle Physics Outreach Group: a global network of scientists and educators who bring particle physics to schools and the public", fr: "Coauteur de l'article décrivant l'IPPOG, le groupe international de vulgarisation de la physique des particules : un réseau mondial de scientifiques et d'enseignants qui font découvrir la physique des particules aux écoles et au grand public", nl: "Medeauteur van het artikel over IPPOG, de International Particle Physics Outreach Group: een wereldwijd netwerk van wetenschappers en leerkrachten die deeltjesfysica naar scholen en het publiek brengen", ru: "Соавтор статьи об IPPOG — Международной группе по популяризации физики частиц, глобальной сети учёных и педагогов, которые рассказывают о физике частиц школьникам и широкой публике"}
  - year: "2023"
