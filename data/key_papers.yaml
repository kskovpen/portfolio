    ref: "arXiv:2611.18824"
    url: "https://arxiv.org/abs/2611.18824"
    about: {en: "How well SHiP could spot neutrinos changing type because of a new, hidden neutrino", fr: "À quel point SHiP pourrait voir des neutrinos changer de type à cause d'un nouveau neutrino caché", nl: "Hoe goed SHiP neutrino's zou kunnen zien die van soort veranderen door een nieuw, verborgen neutrino", ru: "Насколько хорошо SHiP сможет заметить, как нейтрино меняют тип из-за нового, скрытого нейтрино"}
  - year: 2026
    title: "A Pythia8 tune for open charm and beauty production in fixed-target collisions"
    ref: "Eur. Phys. J. C 86 (2026) 1316"
    url: "https://doi.org/10.1140/epjc/s10052-026-16548-5"
    about: {en: "Our own tuning of a widely used simulation program, so it predicts better how many charm and beauty particles, and the neutrinos they produce, SHiP will see", fr: "Notre réglage d'un programme de simulation très utilisé, pour mieux prédire combien de particules charmées et belles, et les neutrinos qu'elles produisent, SHiP verra", nl: "Onze eigen afstelling van een veelgebruikt simulatieprogramma, zodat het beter voorspelt hoeveel charm- en beauty-deeltjes, en de neutrino's die ze maken, SHiP zal zien", ru: "Наша настройка широко используемой программы моделирования, чтобы точнее предсказать, сколько очарованных и прелестных частиц и рождённых ими нейтрино увидит SHiP"}
  - year: 2026
    title: "Measurement of di-muons from 400 GeV/c protons interacting in a thick molybdenum/tungsten target"
    ref: "Eur. Phys. J. C 86 (2026) 1231"
    url: "https://doi.org/10.1140/epjc/s10052-026-16148-3"
