    about: {en: "How CMS recognises sprays of particles from bottom quarks, a tool used in about a third of CMS papers; written while I coordinated this team", fr: "Comment CMS reconnaît les gerbes de particules issues de quarks b, un outil utilisé dans environ un tiers des articles de CMS ; écrit quand je coordonnais cette équipe", nl: "Hoe CMS deeltjesbundels van bottom-quarks herkent, een hulpmiddel in ongeveer een derde van de CMS-artikelen; geschreven toen ik dit team coördineerde", ru: "Как CMS распознаёт струи частиц от b-кварков — инструмент примерно трети статей CMS; написано, когда я координировал эту группу"}

