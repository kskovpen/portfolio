# Outreach: featured projects (cards) and a full timeline. Shown on /outreach/ and on the home page.
featured:
  - key: astrolab
    spot: cosmic
    when: {en: "Now", fr: "Actuel", nl: "Nu", ru: "Сейчас"}
    link: https://astrolab.be
    title: {en: "Catching particles from space", fr: "Attraper des particules venues de l'espace", nl: "Deeltjes uit de ruimte vangen", ru: "Ловим частицы из космоса"}
    text: {en: "With AstroLAB IRIS in Ypres, students build detectors for cosmic muons: particles from space that pass through us every second.", fr: "Avec AstroLAB IRIS à Ypres, des étudiants construisent des détecteurs de muons cosmiques : des particules venues de l'espace qui nous traversent à chaque seconde.", nl: "Met AstroLAB IRIS in Ieper bouwen studenten detectoren voor kosmische muonen: deeltjes uit de ruimte die elke seconde door ons heen gaan.", ru: "Вместе с AstroLAB IRIS в Ипре студенты строят детекторы космических мюонов — частиц из космоса, каждую секунду пролетающих сквозь нас."}
  - key: games
    spot: public
    when: {en: "2022–2023", fr: "2022–2023", nl: "2022–2023", ru: "2022–2023"}
    link: /projects/
    title: {en: "Games about particles", fr: "Des jeux sur les particules", nl: "Games over deeltjes", ru: "Игры о частицах"}
    text: {en: "Hunt for the Higgs boson in Higgsy, or build particles from bricks in MatterBricks. Both are free.", fr: "Cherchez le boson de Higgs dans Higgsy ou assemblez des particules dans MatterBricks. Les deux sont gratuits.", nl: "Zoek het higgsboson in Higgsy of bouw deeltjes met blokjes in MatterBricks. Beide zijn gratis.", ru: "Ищите бозон Хиггса в Higgsy или собирайте частицы из кирпичиков в MatterBricks. Обе игры бесплатны."}
  - key: schools
    spot: talks
    when: {en: "2015–", fr: "2015–", nl: "2015–", ru: "2015–"}
    title: {en: "Talks for schools", fr: "Exposés pour les écoles", nl: "Lezingen voor scholen", ru: "Лекции для школьников"}
    text: {en: "Talks in schools and CERN Masterclasses, where pupils analyse real collision data.", fr: "Des exposés dans les écoles et les Masterclasses du CERN, où des élèves analysent de vraies collisions.", nl: "Lezingen op scholen en CERN-masterclasses, waar leerlingen echte botsingsdata analyseren.", ru: "Лекции в школах и мастер-классы ЦЕРН, где школьники анализируют настоящие столкновения."}
  - key: media
    spot: press
    when: {en: "2018", fr: "2018", nl: "2018", ru: "2018"}
    title: {en: "In the news", fr: "Dans les médias", nl: "In de media", ru: "В СМИ"}
    text: {en: "The press release and a public blog about the first sighting of the Higgs boson with top quarks.", fr: "Le communiqué de presse et un blog grand public sur la première observation du boson de Higgs avec des quarks top.", nl: "Het persbericht en een publieksblog over de eerste waarneming van het higgsboson met top-quarks.", ru: "Пресс-релиз и научно-популярный блог о первом наблюдении бозона Хиггса вместе с топ-кварками."}
