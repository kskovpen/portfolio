# "Detector technologies" band on the Research page.
# Photo fields (file under assets/, author, licence, licence_url, source) are optional; credit is shown under each photo.
- key: sipm
  tech: {en: "Scintillators: crystals, plastic and fibres", fr: "Scintillateurs : cristaux, plastique et fibres", nl: "Scintillatoren: kristallen, plastic en vezels", ru: "Сцинтилляторы: кристаллы, пластик и волокна"}
  text: {en: "Crystals such as NaI(Tl) and plastic tiles turn particles into flashes of light; fibres guide it and light sensors, today tiny silicon SiPMs, count the photons. I measured how precisely crystals time each hit, and we now build a new calorimeter this way.", fr: "Des cristaux comme le NaI(Tl) et des tuiles de plastique transforment les particules en éclairs de lumière ; des fibres la guident et des capteurs, aujourd'hui de minuscules SiPM en silicium, comptent les photons. J'ai mesuré la précision temporelle des cristaux, et nous construisons maintenant ainsi un nouveau calorimètre.", nl: "Kristallen zoals NaI(Tl) en plastic tegels zetten deeltjes om in lichtflitsjes; vezels geleiden het licht en lichtsensoren, nu piepkleine silicium-SiPM's, tellen de fotonen. Ik mat hoe precies kristallen elke treffer in de tijd plaatsen, en nu bouwen we zo een nieuwe calorimeter.", ru: "Кристаллы вроде NaI(Tl) и пластиковые пластины превращают частицы во вспышки света; волокна проводят его, а фотодетекторы — сегодня крошечные кремниевые SiPM — считают фотоны. Я измерял временно́е разрешение кристаллов, а теперь мы так строим новый калориметр."}
- key: lar
  tech: {en: "Liquid-argon calorimetry", fr: "Calorimétrie à argon liquide", nl: "Vloeibaar-argoncalorimetrie", ru: "Жидкоаргоновая калориметрия"}
  text: {en: "Liquid argon between accordion-shaped metal plates measures the energy of particles. I worked on the software that watches over its electronics.", fr: "De l'argon liquide entre des plaques métalliques en accordéon mesure l'énergie des particules. J'ai travaillé sur le logiciel qui surveille son électronique.", nl: "Vloeibaar argon tussen accordeonvormige metalen platen meet de energie van deeltjes. Ik werkte aan de software die de elektronica ervan bewaakt.", ru: "Жидкий аргон между металлическими пластинами в форме гармошки измеряет энергию частиц. Я работал над программами, которые следят за его электроникой."}
- key: gas
  tech: {en: "Gas detectors: RPC and GEM", fr: "Détecteurs à gaz : RPC et GEM", nl: "Gasdetectoren: RPC en GEM", ru: "Газовые детекторы: RPC и GEM"}
  text: {en: "Thin layers of gas between electrodes catch muons, the only particles that cross the whole detector. We build and test them in our Ghent lab.", fr: "De fines couches de gaz entre des électrodes captent les muons, les seules particules qui traversent tout le détecteur. Nous les construisons et les testons dans notre laboratoire de Gand.", nl: "Dunne gaslagen tussen elektroden vangen muonen, de enige deeltjes die de hele detector doorkruisen. We bouwen en testen ze in ons Gentse lab.", ru: "Тонкие слои газа между электродами регистрируют мюоны — единственные частицы, пролетающие весь детектор насквозь. Мы собираем и испытываем их в нашей лаборатории в Генте."}
