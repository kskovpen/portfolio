# "Detector technologies" band on the Research page.
# Photo fields (file under assets/, author, licence, licence_url, source) are optional; credit is shown under each photo.
- key: crystals
  tech: {en: "Scintillating crystals", fr: "Cristaux scintillants", nl: "Scintillerende kristallen", ru: "Сцинтилляционные кристаллы"}
  text: {en: "Crystals such as NaI(Tl) glow when a particle passes through them. I measured how precisely they tell the time of each hit.", fr: "Des cristaux comme le NaI(Tl) s'illuminent au passage d'une particule. J'ai mesuré la précision avec laquelle ils donnent l'instant de chaque impact.", nl: "Kristallen zoals NaI(Tl) lichten op wanneer er een deeltje door gaat. Ik mat hoe precies ze het tijdstip van elke treffer geven.", ru: "Кристаллы вроде NaI(Tl) вспыхивают, когда через них проходит частица. Я измерял, насколько точно они определяют время каждого события."}
- key: lar
  tech: {en: "Liquid-argon calorimetry", fr: "Calorimétrie à argon liquide", nl: "Vloeibaar-argoncalorimetrie", ru: "Жидкоаргоновая калориметрия"}
  text: {en: "Argon cooled to −186 °C measures the energy of particles. I worked on the software that watches over its electronics.", fr: "De l'argon refroidi à −186 °C mesure l'énergie des particules. J'ai travaillé sur le logiciel qui surveille son électronique.", nl: "Argon, afgekoeld tot −186 °C, meet de energie van deeltjes. Ik werkte aan de software die de elektronica ervan bewaakt.", ru: "Аргон, охлаждённый до −186 °C, измеряет энергию частиц. Я работал над программами, которые следят за его электроникой."}
- key: gas
  tech: {en: "Gas detectors: RPC and GEM", fr: "Détecteurs à gaz : RPC et GEM", nl: "Gasdetectoren: RPC en GEM", ru: "Газовые детекторы: RPC и GEM"}
  text: {en: "Thin layers of gas between electrodes catch muons, the only particles that cross the whole detector. We build and test them in our Ghent lab.", fr: "De fines couches de gaz entre des électrodes captent les muons, les seules particules qui traversent tout le détecteur. Nous les construisons et les testons dans notre laboratoire de Gand.", nl: "Dunne gaslagen tussen elektroden vangen muonen, de enige deeltjes die de hele detector doorkruisen. We bouwen en testen ze in ons Gentse lab.", ru: "Тонкие слои газа между электродами регистрируют мюоны — единственные частицы, пролетающие весь детектор насквозь. Мы собираем и испытываем их в нашей лаборатории в Генте."}
- key: sipm
  tech: {en: "Scintillators, fibres and SiPMs", fr: "Scintillateurs, fibres et SiPM", nl: "Scintillatoren, vezels en SiPM's", ru: "Сцинтилляторы, волокна и SiPM"}
  text: {en: "Plastic turns particles into flashes of light, fibres guide it, and tiny silicon sensors count the photons. This is how we build a new calorimeter.", fr: "Le plastique transforme les particules en éclairs de lumière, des fibres la guident et de minuscules capteurs en silicium comptent les photons. C'est ainsi que nous construisons un nouveau calorimètre.", nl: "Plastic zet deeltjes om in lichtflitsjes, vezels geleiden het licht en piepkleine siliciumsensoren tellen de fotonen. Zo bouwen we een nieuwe calorimeter.", ru: "Пластик превращает частицы во вспышки света, волокна проводят его, а крошечные кремниевые датчики считают фотоны. Так мы создаём новый калориметр."}
