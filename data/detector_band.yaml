# "Detector technologies" band on the Research page, one tile per technology.
# key = drawing in partials/spot.html. Photo fields (file under assets/, author, licence, licence_url, source) are optional.
- key: calo
  tech: {en: "Calorimetry", fr: "Calorimétrie", nl: "Calorimetrie", ru: "Калориметрия"}
  text: {en: "Calorimeters stop particles and measure their energy. I measured how precisely the NaI(Tl) crystals of SND time each hit, worked on the liquid-argon accordion calorimeter of ATLAS, and now develop a calorimeter for SHiP made of scintillators, fibres and tiny silicon light sensors (SiPMs).", fr: "Les calorimètres arrêtent les particules et mesurent leur énergie. J'ai mesuré la précision temporelle des cristaux NaI(Tl) de SND, travaillé sur le calorimètre à argon liquide en accordéon d'ATLAS, et je développe aujourd'hui pour SHiP un calorimètre fait de scintillateurs, de fibres et de minuscules capteurs de lumière en silicium (SiPM).", nl: "Calorimeters houden deeltjes tegen en meten hun energie. Ik mat hoe precies de NaI(Tl)-kristallen van SND elke treffer in de tijd plaatsen, werkte aan de vloeibaar-argon-accordeoncalorimeter van ATLAS, en ontwikkel nu voor SHiP een calorimeter uit scintillatoren, vezels en piepkleine siliciumlichtsensoren (SiPM's).", ru: "Калориметры останавливают частицы и измеряют их энергию. Я измерял временно́е разрешение кристаллов NaI(Tl) детектора СНД, работал с жидкоаргоновым калориметром ATLAS с пластинами-«гармошкой», а сейчас разрабатываю для SHiP калориметр из сцинтилляторов, волокон и крошечных кремниевых фотодетекторов (SiPM)."}
- key: gas
  tech: {en: "Gaseous detectors", fr: "Détecteurs gazeux", nl: "Gasdetectoren", ru: "Газовые детекторы"}
  text: {en: "Thin layers of gas between electrodes catch muons, the only particles that cross the whole detector. In our Ghent lab we build and test new RPC and GEM chambers for CMS.", fr: "De fines couches de gaz entre des électrodes captent les muons, les seules particules qui traversent tout le détecteur. Dans notre laboratoire de Gand, nous construisons et testons de nouvelles chambres RPC et GEM pour CMS.", nl: "Dunne gaslagen tussen elektroden vangen muonen, de enige deeltjes die de hele detector doorkruisen. In ons Gentse lab bouwen en testen we nieuwe RPC- en GEM-kamers voor CMS.", ru: "Тонкие слои газа между электродами регистрируют мюоны — единственные частицы, пролетающие весь детектор насквозь. В нашей лаборатории в Генте мы собираем и испытываем новые камеры RPC и GEM для CMS."}
- key: silicon
  tech: {en: "Silicon trackers", fr: "Trajectographes en silicium", nl: "Siliciumsporendetectoren", ru: "Кремниевые трековые детекторы"}
  text: {en: "Thin silicon sensors record the path of each charged particle to a fraction of a hair's width. At the IIHE in Brussels I contribute to the new CMS tracker, after testing its first prototype modules in a particle beam at DESY in Hamburg.", fr: "De fins capteurs en silicium enregistrent la trajectoire de chaque particule chargée à une fraction de l'épaisseur d'un cheveu près. À l'IIHE à Bruxelles, je contribue au nouveau trajectographe de CMS, après avoir testé ses premiers modules prototypes dans un faisceau de particules à DESY, à Hambourg.", nl: "Dunne siliciumsensoren leggen de baan van elk geladen deeltje vast tot op een fractie van de dikte van een haar. Aan het IIHE in Brussel draag ik bij aan de nieuwe spoordetector van CMS, nadat ik de eerste prototypemodules in een deeltjesbundel bij DESY in Hamburg testte.", ru: "Тонкие кремниевые датчики записывают траекторию каждой заряженной частицы с точностью до доли толщины волоса. В IIHE в Брюсселе я участвую в создании нового трекера CMS — после того как испытывал его первые прототипы модулей на пучке частиц в DESY (Гамбург)."}
