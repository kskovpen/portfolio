teaching:
  en: "Master's courses at the Vrije Universiteit Brussel and exercise classes at Ghent University; guest lecturer at the Belgian doctoral school in particle physics. I also explain physics to the public, for example with the iPhone apps [Higgsy](/projects/higgsy/) and [MatterBricks](/projects/matterbricks/) and school talks such as \"A Big Bang in the Lab\"."
  fr: "Cours de master à la Vrije Universiteit Brussel et travaux dirigés à l'Université de Gand ; conférencier invité à l'école doctorale belge de physique des particules. J'explique aussi la physique au grand public, par exemple avec les applications iPhone [Higgsy](/fr/projects/higgsy/) et [MatterBricks](/fr/projects/matterbricks/) et des exposés dans les écoles comme « Un Big Bang au labo »."
  nl: "Mastercolleges aan de Vrije Universiteit Brussel en oefeningen aan de Universiteit Gent; gastdocent aan de Belgische doctoraatsschool deeltjesfysica. Ik leg natuurkunde ook uit aan het grote publiek, bijvoorbeeld met de iPhone-apps [Higgsy](/nl/projects/higgsy/) en [MatterBricks](/nl/projects/matterbricks/) en schoolpresentaties zoals \"Een oerknal in het lab\"."
  ru: "Магистерские курсы в Брюссельском свободном университете (VUB) и семинары в Гентском университете; приглашённый лектор бельгийской аспирантской школы по физике частиц. Рассказываю о физике широкой публике — например, в приложениях для iPhone [Higgsy](/ru/projects/higgsy/) и [MatterBricks](/ru/projects/matterbricks/) и в лекциях для школьников, таких как «Большой взрыв в лаборатории»."

