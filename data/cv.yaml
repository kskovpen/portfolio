publications_note:
  en: "As a member of large international collaborations of several thousand scientists, I co-author all of their papers: more than 1,100 in total. The topics above describe the results I contributed to most; the full list is on [INSPIRE](https://inspirehep.net/authors/1066490), the public database of physics papers."
  fr: "Comme membre de grandes collaborations internationales de plusieurs milliers de scientifiques, je cosigne tous leurs articles : plus de 1 100 au total. Les thèmes ci-dessus décrivent les résultats auxquels j'ai le plus contribué ; la liste complète est sur [INSPIRE](https://inspirehep.net/authors/1066490), la base de données publique des articles de physique."
  nl: "Als lid van grote internationale samenwerkingen van enkele duizenden wetenschappers ben ik medeauteur van al hun artikelen: in totaal meer dan 1.100. De onderwerpen hierboven beschrijven de resultaten waaraan ik het meest heb bijgedragen; de volledige lijst staat op [INSPIRE](https://inspirehep.net/authors/1066490), de openbare databank van natuurkundeartikelen."
  ru: "Как участник крупных международных коллабораций из нескольких тысяч учёных, я соавтор всех их статей — в сумме более 1100. Темы выше описывают результаты, в которые я внёс наибольший вклад; полный список — в [INSPIRE](https://inspirehep.net/authors/1066490), открытой базе статей по физике."
