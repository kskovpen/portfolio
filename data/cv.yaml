career:
  - years: "2023–"
    short:
      en: "Permanent researcher"
      fr: "Chercheur permanent"
      nl: "Vast onderzoeker"
      ru: "Штатный научный сотрудник"
    place: "Ghent University"
    city:
      en: "Ghent, Belgium"
      fr: "Gand, Belgique"
      nl: "Gent, België"
      ru: "Гент, Бельгия"
    role:
      en: "Permanent researcher. Leads the Ghent group in SHiP, a new experiment that will hunt for very light, hidden particles, and is deputy leader of the Ghent group in CMS, one of the two giant experiments at CERN that discovered the Higgs boson."
      fr: "Chercheur permanent. Dirige le groupe de Gand dans SHiP, une nouvelle expérience qui traquera des particules très légères et cachées, et est chef adjoint du groupe de Gand dans CMS, l'une des deux expériences géantes du CERN qui ont découvert le boson de Higgs."
      nl: "Vast onderzoeker. Leidt de Gentse groep in SHiP, een nieuw experiment dat zal zoeken naar zeer lichte, verborgen deeltjes, en is adjunct-leider van de Gentse groep in CMS, een van de twee reuzenexperimenten bij CERN die het higgsboson ontdekten."
      ru: "Штатный научный сотрудник. Руководит гентской группой в SHiP — новом эксперименте, который будет искать очень лёгкие «скрытые» частицы, — и является заместителем руководителя гентской группы в CMS, одном из двух гигантских экспериментов ЦЕРН, открывших бозон Хиггса."
  - years: "2019–2023"
    short:
      en: "Senior researcher"
      fr: "Chercheur senior"
      nl: "Senior onderzoeker"
      ru: "Старший научный сотрудник"
    place: "Ghent University"
    city:
      en: "Ghent, Belgium"
      fr: "Gand, Belgique"
      nl: "Gent, België"
      ru: "Гент, Бельгия"
    role:
      en: "Senior researcher on a fixed-term contract (a \"postdoc\"). Coordinated the people who check that the software and computer simulations of the CMS detector work correctly."
      fr: "Chercheur senior en contrat à durée déterminée (« postdoc »). A coordonné les personnes qui vérifient que les logiciels et les simulations informatiques du détecteur CMS fonctionnent correctement."
      nl: "Senior onderzoeker met een tijdelijk contract (een \"postdoc\"). Coördineerde de mensen die controleren of de software en computersimulaties van de CMS-detector correct werken."
      ru: "Старший научный сотрудник по срочному контракту («постдок»). Координировал людей, которые проверяют, что программы и компьютерное моделирование детектора CMS работают правильно."
  - years: "2016–2019"
    short:
      en: "Research fellow (FWO)"
      fr: "Chercheur boursier (FWO)"
      nl: "Onderzoeker met FWO-beurs"
      ru: "Исследователь, грант FWO"
    place: "Vrije Universiteit Brussel"
    city:
      en: "Brussels, Belgium"
      fr: "Bruxelles, Belgique"
      nl: "Brussel, België"
      ru: "Брюссель, Бельгия"
    role:
      en: "Researcher with a personal grant from the Flemish science funding agency (FWO). Studied how the Higgs boson interacts with the top quark, the heaviest known particle."
      fr: "Chercheur avec une bourse personnelle de l'agence flamande de financement de la recherche (FWO). A étudié comment le boson de Higgs interagit avec le quark top, la particule la plus lourde connue."
      nl: "Onderzoeker met een persoonlijke beurs van het Vlaamse Fonds Wetenschappelijk Onderzoek (FWO). Onderzocht hoe het higgsboson inwerkt op het top-quark, het zwaarste bekende deeltje."
      ru: "Исследователь с персональным грантом фламандского научного фонда (FWO). Изучал, как бозон Хиггса взаимодействует с топ-кварком — самой тяжёлой известной частицей."
  - years: "2013–2016"
