# Professional profile shown on the About page, in plain language for a general audience.
# Source of the facts: ~/Work/CV/vub/cv.tex (the full CV). Keep only key things here.
# Each text has en / fr / nl / ru versions.

what_i_do:
  - icon: particle
    title:
      en: "Studying the heaviest particle"
      fr: "Étudier la particule la plus lourde"
      nl: "De zwaarste deeltjes bestuderen"
      ru: "Изучаю самую тяжёлую частицу"
    text:
      en: "The top quark is the heaviest known particle, as heavy as a gold atom. I study it to look for cracks in today's theory."
      fr: "Le quark top est la particule la plus lourde connue, aussi lourde qu'un atome d'or. Je l'étudie pour chercher des failles dans la théorie actuelle."
      nl: "Het top-quark is het zwaarste bekende deeltje, zo zwaar als een goudatoom. Ik bestudeer het om barsten in de huidige theorie te vinden."
      ru: "Топ-кварк — самая тяжёлая известная частица, тяжёлая, как атом золота. Я изучаю его, чтобы найти «трещины» в современной теории."
  - icon: detector
    title:
      en: "Building particle detectors"
      fr: "Construire des détecteurs"
      nl: "Deeltjesdetectoren bouwen"
      ru: "Создаю детекторы частиц"
    text:
      en: "Detectors are giant cameras for particle collisions. I help build new ones for CMS and for SHiP."
      fr: "Les détecteurs sont des appareils photo géants pour les collisions. J'aide à en construire de nouveaux pour CMS et SHiP."
      nl: "Detectoren zijn reusachtige camera's voor botsingen. Ik help nieuwe bouwen voor CMS en SHiP."
      ru: "Детекторы — гигантские фотокамеры для столкновений. Я помогаю строить новые для CMS и SHiP."
  - icon: data
    title:
      en: "Making sure the data can be trusted"
      fr: "Garantir la fiabilité des données"
      nl: "Zorgen dat de data betrouwbaar zijn"
      ru: "Слежу, чтобы данным можно было доверять"
    text:
      en: "CMS records billions of collisions. I have led teams that check the detector, software and simulations, so every result is solid."
      fr: "CMS enregistre des milliards de collisions. J'ai dirigé des équipes qui vérifient le détecteur, les logiciels et les simulations, pour des résultats solides."
      nl: "CMS legt miljarden botsingen vast. Ik leidde teams die detector, software en simulaties controleren, zodat elk resultaat klopt."
      ru: "CMS регистрирует миллиарды столкновений. Я руководил группами, проверяющими детектор, программы и моделирование, чтобы каждый результат был надёжным."

