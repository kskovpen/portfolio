teaching:
  en: "Besides research I teach: master's courses at the Vrije Universiteit Brussel, exercise classes at Ghent University, and guest lectures at the Belgian school for young researchers in particle physics. For schools and the general public I give talks such as \"A Big Bang in the Lab\"."
  fr: "En plus de la recherche, j'enseigne : cours de master à la Vrije Universiteit Brussel, travaux dirigés à l'Université de Gand et cours invités à l'école belge des jeunes chercheurs en physique des particules. Pour les écoles et le grand public, je donne des exposés comme « Un Big Bang au labo »."
  nl: "Naast onderzoek geef ik les: mastercolleges aan de Vrije Universiteit Brussel, oefeningen aan de Universiteit Gent en gastcolleges aan de Belgische school voor jonge onderzoekers in de deeltjesfysica. Voor scholen en het grote publiek geef ik lezingen zoals \"Een oerknal in het lab\"."
  ru: "Помимо исследований, я преподаю: магистерские курсы в Брюссельском свободном университете (VUB), семинары в Гентском университете и гостевые лекции в бельгийской школе для молодых исследователей в физике частиц. Для школьников и широкой публики читаю лекции, например «Большой взрыв в лаборатории»."

outreach:
  en: "Two of these games explain my day job: in [Higgsy](/projects/higgsy/) you hunt for the Higgs boson like a physicist at CERN, and in [MatterBricks](/projects/matterbricks/) the smallest particles of matter become puzzle pieces."
  fr: "Deux de ces jeux expliquent mon métier : dans [Higgsy](/fr/projects/higgsy/), vous cherchez le boson de Higgs comme un physicien du CERN, et dans [MatterBricks](/fr/projects/matterbricks/), les plus petites particules de la matière deviennent des pièces de puzzle."
  nl: "Twee van deze games leggen mijn werk uit: in [Higgsy](/nl/projects/higgsy/) zoek je naar het higgsboson zoals een fysicus bij CERN, en in [MatterBricks](/nl/projects/matterbricks/) worden de kleinste deeltjes van materie puzzelstukjes."
  ru: "Две из этих игр рассказывают о моей работе: в [Higgsy](/ru/projects/higgsy/) вы ищете бозон Хиггса, как физик в ЦЕРН, а в [MatterBricks](/ru/projects/matterbricks/) мельчайшие частицы материи становятся деталями головоломки."

