  fr: "Comme membre de grandes collaborations internationales de plusieurs milliers de scientifiques, je cosigne tous leurs articles : plus de 1 100 au total. Mes propres contributions sont décrites sur la page Recherche et listées sur INSPIRE."
  nl: "Als lid van grote internationale samenwerkingen van enkele duizenden wetenschappers ben ik medeauteur van al hun artikelen: in totaal meer dan 1.100. Mijn eigen bijdragen staan op de pagina Onderzoek en op INSPIRE."
  ru: "Как участник крупных международных коллабораций из нескольких тысяч учёных, я соавтор всех их статей — в сумме более 1100. Мой собственный вклад описан в разделе «Исследования» и указан в базе INSPIRE."
