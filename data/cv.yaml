highlights:
  - year: "2023"
    title:
      en: "Four top quarks at once"
      fr: "Quatre quarks top à la fois"
      nl: "Vier top-quarks tegelijk"
      ru: "Четыре топ-кварка сразу"
    text:
      en: "One of the main analysts behind the first observation of four top quarks produced together, one of the rarest processes ever seen at the LHC. I presented it at CERN."
      fr: "L'un des principaux analystes de la première observation de quatre quarks top produits ensemble, l'un des processus les plus rares jamais observés au LHC. Je l'ai présentée au CERN."
      nl: "Een van de hoofdanalisten achter de eerste waarneming van vier samen geproduceerde top-quarks, een van de zeldzaamste processen ooit gezien bij de LHC. Ik presenteerde het resultaat bij CERN."
      ru: "Один из основных авторов анализа, впервые наблюдавшего рождение сразу четырёх топ-кварков — одного из самых редких процессов, когда-либо замеченных на БАК. Я представлял этот результат в ЦЕРН."
    link: /science/top-quark/four-tops/
  - year: "2018"
    title:
      en: "The Higgs boson meets the top quark"
      fr: "Le boson de Higgs rencontre le quark top"
      nl: "Het higgsboson ontmoet het top-quark"
      ru: "Бозон Хиггса и топ-кварк"
    text:
      en: "Part of the team that first saw the Higgs boson produced together with top quarks, direct proof that the Higgs gives the top quark its huge mass."
      fr: "Membre de l'équipe qui a vu pour la première fois le boson de Higgs produit avec des quarks top, preuve directe que le Higgs donne au quark top son énorme masse."
      nl: "Deel van het team dat voor het eerst zag hoe het higgsboson samen met top-quarks ontstaat, een direct bewijs dat het higgsboson het top-quark zijn enorme massa geeft."
      ru: "В команде, которая впервые увидела рождение бозона Хиггса вместе с топ-кварками, — прямое доказательство того, что именно Хиггс придаёт топ-кварку его огромную массу."
  - year: "2022"
    title:
      en: "Searching for forbidden decays"
      fr: "À la recherche de désintégrations interdites"
      nl: "Op zoek naar verboden vervallen"
      ru: "Поиск «запрещённых» распадов"
    text:
      en: "Started a search for a top quark turning into a lighter quark and a Higgs boson, something today's theory almost forbids. It set the strictest limits in the world at the time."
      fr: "A lancé la recherche d'un quark top se transformant en un quark plus léger et un boson de Higgs, ce que la théorie actuelle interdit presque. Elle a établi les limites les plus strictes au monde à l'époque."
      nl: "Startte een zoektocht naar een top-quark dat verandert in een lichter quark en een higgsboson, iets wat de huidige theorie bijna verbiedt. Die leverde destijds de strengste limieten ter wereld op."
      ru: "Инициировал поиск превращения топ-кварка в более лёгкий кварк и бозон Хиггса — процесса, почти запрещённого современной теорией. Были получены самые строгие на тот момент ограничения в мире."
  - year: "2018"
    title:
      en: "Teaching the detector to spot bottom quarks"
      fr: "Apprendre au détecteur à repérer les quarks bottom"
      nl: "De detector bottom-quarks leren herkennen"
      ru: "Как научить детектор узнавать b-кварки"
    text:
      en: "Led the team and co-wrote the reference paper on how CMS recognises sprays of particles that come from bottom quarks, a tool used in about a third of all CMS publications."
      fr: "A dirigé l'équipe et co-écrit l'article de référence sur la façon dont CMS reconnaît les gerbes de particules issues de quarks bottom, un outil utilisé dans environ un tiers des publications de CMS."
      nl: "Leidde het team en schreef mee aan het referentieartikel over hoe CMS deeltjesbundels van bottom-quarks herkent, een techniek die in ongeveer een derde van alle CMS-publicaties wordt gebruikt."
      ru: "Руководил группой и был соавтором основополагающей статьи о том, как CMS распознаёт струи частиц от b-кварков, — этот метод используется примерно в трети всех публикаций CMS."

