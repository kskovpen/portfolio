    role:
      en: "Researcher on a fixed-term contract (a \"postdoc\") at a French national research lab. Joined CMS and led the team that teaches the detector to recognise particles coming from bottom quarks."
      fr: "Chercheur en contrat à durée déterminée (« postdoc ») dans un laboratoire du CNRS. A rejoint CMS et dirigé l'équipe qui apprend au détecteur à reconnaître les particules issues de quarks bottom."
      nl: "Onderzoeker met een tijdelijk contract (een \"postdoc\") in een Frans nationaal onderzoekslab. Werd lid van CMS en leidde het team dat de detector leert deeltjes van bottom-quarks te herkennen."
      ru: "Исследователь по срочному контракту («постдок») во французской национальной лаборатории. Присоединился к CMS и руководил группой, которая «учит» детектор распознавать частицы от b-кварков."
