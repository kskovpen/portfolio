# Professional profile shown on the About page, in plain language for a general audience.
# Source of the facts: ~/Work/CV/vub/cv.tex (the full CV). Keep only key things here.
# Each text has en / fr / nl / ru versions.

what_i_do:
  - icon: particle
    title:
      en: "Studying the heaviest particle"
      fr: "Étudier la particule la plus lourde"
      nl: "De zwaarste deeltjes bestuderen"
      ru: "Изучаю самую тяжёлую частицу"
    text:
      en: "The top quark is the heaviest elementary particle we know, as heavy as a gold atom. I look at how it is produced and decays in proton collisions at CERN, searching for small deviations that would reveal physics beyond today's theory."
      fr: "Le quark top est la particule élémentaire la plus lourde connue, aussi lourde qu'un atome d'or. J'étudie comment il est produit et se désintègre dans les collisions de protons au CERN, à la recherche de petits écarts qui révéleraient une physique au-delà de la théorie actuelle."
      nl: "Het top-quark is het zwaarste elementaire deeltje dat we kennen, zo zwaar als een goudatoom. Ik bestudeer hoe het ontstaat en vervalt in protonbotsingen bij CERN, op zoek naar kleine afwijkingen die natuurkunde voorbij de huidige theorie zouden onthullen."
      ru: "Топ-кварк — самая тяжёлая из известных элементарных частиц, весом с атом золота. Я изучаю, как он рождается и распадается в столкновениях протонов в ЦЕРН, и ищу небольшие отклонения, которые указали бы на физику за пределами нынешней теории."
  - icon: detector
    title:
      en: "Building particle detectors"
      fr: "Construire des détecteurs"
      nl: "Deeltjesdetectoren bouwen"
      ru: "Создаю детекторы частиц"
    text:
      en: "Experiments are giant cameras that photograph particle collisions. I help build new parts for them, for the upgraded CMS detector at CERN and for SHiP, a new experiment that will hunt for very light, hidden particles."
      fr: "Les expériences sont des caméras géantes qui photographient les collisions de particules. J'aide à en construire de nouvelles parties, pour le détecteur CMS modernisé au CERN et pour SHiP, une nouvelle expérience qui traquera des particules très légères et cachées."
      nl: "Experimenten zijn reusachtige camera's die deeltjesbotsingen fotograferen. Ik help nieuwe onderdelen bouwen, voor de vernieuwde CMS-detector bij CERN en voor SHiP, een nieuw experiment dat zal zoeken naar zeer lichte, verborgen deeltjes."
      ru: "Эксперименты — это гигантские фотокамеры, снимающие столкновения частиц. Я участвую в создании новых узлов для них: для модернизированного детектора CMS в ЦЕРН и для SHiP — нового эксперимента, который будет искать очень лёгкие «скрытые» частицы."
  - icon: data
    title:
      en: "Making sure the data can be trusted"
      fr: "Garantir la fiabilité des données"
      nl: "Zorgen dat de data betrouwbaar zijn"
      ru: "Слежу, чтобы данным можно было доверять"
    text:
      en: "The CMS detector records billions of collisions. I have led teams of scientists who check that the detector, its software and the simulations behave correctly, so that every result built on them is solid."
      fr: "Le détecteur CMS enregistre des milliards de collisions. J'ai dirigé des équipes de scientifiques qui vérifient que le détecteur, ses logiciels et les simulations fonctionnent correctement, pour que chaque résultat qui en découle soit solide."
      nl: "De CMS-detector registreert miljarden botsingen. Ik heb teams van wetenschappers geleid die controleren of de detector, de software en de simulaties correct werken, zodat elk resultaat dat erop steunt solide is."
      ru: "Детектор CMS регистрирует миллиарды столкновений. Я руководил группами учёных, которые проверяют, что детектор, программы и моделирование работают правильно, — чтобы любой результат на их основе был надёжным."

