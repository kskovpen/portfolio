cern_text = "ЦЕРН — Европейская лаборатория физики частиц — расположен на границе Франции и Швейцарии под Женевой. Его крупнейшая машина, Большой адронный коллайдер, — это 27-километровое кольцо на глубине около 100 метров. Протоны мчатся по нему в обе стороны и сталкиваются в четырёх гигантских детекторах, среди которых CMS, где я работаю, и ATLAS, где я защитил диссертацию. Ускоритель поменьше, SPS, питает БАК и будет направлять свои протоны и в SHiP."
