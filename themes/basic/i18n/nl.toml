cern_text = "CERN, het Europese laboratorium voor deeltjesfysica, ligt op de grens tussen Frankrijk en Zwitserland bij Genève. De grootste machine, de Large Hadron Collider, is een ring van 27 kilometer, zo'n 100 meter onder de grond. Protonen razen er in beide richtingen rond en botsen in vier reusachtige detectoren, waaronder CMS, waar ik werk, en ATLAS, waar ik promoveerde. Een kleinere versneller, de SPS, voedt de LHC en zal ook zijn protonen naar SHiP sturen."
