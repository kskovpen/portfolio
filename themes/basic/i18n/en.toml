cern_text = "CERN, the European laboratory for particle physics, sits on the border between France and Switzerland near Geneva. Its biggest machine, the Large Hadron Collider, is a 27-kilometre ring about 100 metres underground. Protons race around it in both directions and collide in four giant detectors, including CMS, where I work, and ATLAS, where I did my PhD. A smaller accelerator, the SPS, feeds the LHC and will also send its protons to SHiP."
