{{- /* Static map snapshot made by scripts/map_snapshots.py. Param: dict "src" (image URL) "alt" */ -}}
{{- with .src }}
<figure class="map-snapshot">
  <img src="{{ . }}" alt="{{ $.alt }}" loading="lazy" width="1200" height="640">
  <figcaption>Map &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</figcaption>
</figure>
{{- end }}
