{{- /* Simplified map of the LHC near Geneva (original drawing, not to scale): the 27 km ring with a
       circulating particle, the four LHC experiments, the SPS and the SHiP site, border and lake. */ -}}
<svg class="drawing lhc-map" viewBox="0 0 600 360" role="img" aria-label="{{ T "lhc_map" }}">
  <path class="m-jura" d="M0 0 H250 C 200 40 120 70 0 120 Z"/>
  <text class="m-region" x="20" y="40">{{ T "map_jura" }}</text>
  <path class="m-lake" d="M600 150 C 560 170 520 200 500 240 C 485 270 470 300 455 360 H600 Z"/>
  <text class="m-water" x="545" y="300" text-anchor="middle">{{ T "map_lake" }}</text>
  <path class="m-border" d="M395 0 C 370 60 360 120 345 175 C 330 230 335 300 310 360"/>
  <text class="m-country" x="40" y="330">{{ T "map_france" }}</text>
  <text class="m-country" x="420" y="70">{{ T "map_switzerland" }}</text>
  <circle class="m-city" cx="460" cy="285" r="6"/><text class="m-place" x="470" y="276">{{ T "map_geneva" }}</text>
  <circle class="m-ring" id="lhcring" cx="240" cy="170" r="125"/>
  <circle class="m-sps" cx="300" cy="215" r="42"/>
  <path class="m-line" d="M300 257 L320 270"/>
  <circle class="m-particle" r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M240 45 A125 125 0 1 1 239.9 45"/></circle>
  <text class="m-ringlabel" x="240" y="170" text-anchor="middle">LHC</text>
  <text class="m-small" x="240" y="188" text-anchor="middle">27 km</text>
  <text class="m-ringlabel m-sps-label" x="300" y="219" text-anchor="middle">SPS</text>
  {{- range slice (slice "ATLAS" 318 268 "end" 1) (slice "CMS" 162 72 "start" 1) (slice "ALICE" 119 205 "end" 0) (slice "LHCb" 362 140 "start" 0) }}
  {{- $mine := eq (index . 4) 1 }}
  <circle class="m-exp{{ if $mine }} m-mine{{ end }}" cx="{{ index . 1 }}" cy="{{ index . 2 }}" r="{{ if $mine }}9{{ else }}7{{ end }}"/>
  <text class="m-exp-label{{ if $mine }} m-mine-label{{ end }}" x="{{ if eq (index . 3) "end" }}{{ sub (index . 1) 14 }}{{ else }}{{ add (index . 1) 14 }}{{ end }}" y="{{ add (index . 2) 5 }}" text-anchor="{{ index . 3 }}">{{ index . 0 }}</text>
  {{- end }}
  <circle class="m-exp m-mine" cx="318" cy="168" r="7"/><text class="m-exp-label m-mine-label" x="330" y="160">SHiP</text>
</svg>
