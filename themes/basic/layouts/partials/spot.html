{{- /* Small original illustrations ("spots") in the style of the experiment drawings.
       {{ partial "spot.html" "courses" }}. Keys: courses, students, schools, public, talks,
       electronics, physics, running, music, travel, generic. Colours follow the theme. */ -}}
{{- $k := . }}
<svg class="spot drawing" viewBox="0 0 160 120" aria-hidden="true">
{{- if eq $k "courses" }}
  {{- /* a blackboard with a Feynman diagram and an equation */}}
  <rect class="s-board" x="10" y="14" width="140" height="84" rx="4"/>
  <rect class="s-frame" x="10" y="14" width="140" height="84" rx="4"/>
  <path class="s-chalk" pathLength="1" d="M30 36 L52 56 L30 76 M52 56 L84 56 M84 56 L106 36 M84 56 L106 76"/>
  <path class="s-chalk-wave" d="M52 56 q4 -6 8 0 t8 0 t8 0 t8 0"/>
  <text class="s-text" x="112" y="60">= ?</text>
  <path class="s-leg" d="M40 98 L34 112 M120 98 L126 112"/>
{{- else if eq $k "students" }}
  {{- /* a lab bench: a scintillator bar, its light sensor and a pulse on the oscilloscope */}}
  <rect class="s-bench" x="8" y="88" width="144" height="8" rx="2"/>
  <rect class="d-snd" x="16" y="66" width="62" height="16" rx="2"/>
  <rect class="d-magnet" x="78" y="69" width="10" height="10" rx="2"/>
  <path class="s-cable" d="M88 74 C 98 74 98 60 104 56"/>
  <rect class="s-scope" x="100" y="26" width="48" height="40" rx="4"/>
  <path class="d-track" pathLength="1" d="M106 52 L116 52 L119 34 L123 52 L142 52"/>
  <path class="d-lepton" pathLength="1" d="M30 14 L46 82"/>
  <circle class="d-burst" cx="42" cy="66" r="3"/>
{{- else if eq $k "schools" }}
  {{- /* mountains, a lecture tent and a rising particle track: summer schools */}}
  <path class="s-mountain" d="M4 100 L44 46 L64 70 L92 30 L156 100 Z"/>
  <path class="s-snow" d="M84 41 L92 30 L100 41 L95 39 L92 43 L88 39 Z"/>
  <path class="s-tent" d="M58 100 L80 72 L102 100 Z"/>
  <path class="s-tent-door" d="M74 100 L80 88 L86 100 Z"/>
  <path class="d-track" pathLength="1" d="M80 72 Q 104 40 140 18"/>
  <circle class="d-point" cx="80" cy="72" r="2.5"/>
{{- else if eq $k "public" }}
  {{- /* a phone with a particle game and a speech bubble */}}
  <rect class="s-phone" x="20" y="10" width="54" height="100" rx="9"/>
  <rect class="s-screen" x="25" y="20" width="44" height="78" rx="3"/>
  <circle class="d-burst" cx="47" cy="58" r="3"/>
  <path class="d-jet-track" pathLength="1" d="M47 58 L33 34 M47 58 L62 36 M47 58 L60 84"/>
  <path class="d-lepton" pathLength="1" d="M47 58 L30 88"/>
  <path class="s-bubble" d="M90 22 h56 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-34 l-12 12 v-12 h-10 a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z"/>
  <text class="s-text" x="118" y="50" text-anchor="middle">E=mc²</text>
{{- else if eq $k "talks" }}
  {{- /* a projection screen with a plot: data points on top of a prediction, with a bump */}}
  <rect class="s-screen-big" x="12" y="8" width="136" height="80" rx="3"/>
  <path class="s-axis" d="M28 76 L136 76 M28 76 L28 20"/>
  <path class="s-pred" d="M30 70 C 60 66 70 50 80 42 C 88 36 92 56 100 60 C 112 66 124 70 134 72"/>
  {{- range $i, $p := slice (slice 36 68) (slice 46 64) (slice 56 58) (slice 66 52) (slice 76 42) (slice 82 36) (slice 90 48) (slice 100 58) (slice 112 64) (slice 124 69) }}
  <circle class="s-dot" cx="{{ index $p 0 }}" cy="{{ index $p 1 }}" r="2.4"/>
  {{- end }}
  <path class="s-stand" d="M80 88 L80 110 M64 112 L96 112"/>
{{- else if eq $k "cosmic" }}
  {{- /* cosmic muons raining down from the sky onto a stack of detector plates */}}
  <circle class="s-star" cx="20" cy="14" r="1.6"/><circle class="s-star" cx="58" cy="8" r="1.2"/><circle class="s-star" cx="132" cy="12" r="1.6"/><circle class="s-star" cx="100" cy="20" r="1"/>
  <path class="d-lepton" pathLength="1" d="M40 4 L64 74"/>
  <path class="d-lepton" pathLength="1" style="animation-delay:.2s" d="M92 2 L82 74"/>
  <path class="d-lepton" pathLength="1" style="animation-delay:.4s" d="M140 6 L104 74"/>
  <rect class="d-snd" x="40" y="72" width="80" height="8" rx="2"/>
  <rect class="d-snd" x="40" y="86" width="80" height="8" rx="2"/>
  <rect class="d-snd" x="40" y="100" width="80" height="8" rx="2"/>
  <circle class="d-burst" cx="64" cy="76" r="2.6"/><circle class="d-burst" cx="82" cy="76" r="2.6"/><circle class="d-burst" cx="104" cy="76" r="2.6"/>
  <path class="s-cable" d="M120 90 C 134 90 136 104 150 104"/>
{{- else if eq $k "press" }}
  {{- /* a newspaper with a headline photo of a collision */}}
  <rect class="s-paper" x="18" y="12" width="124" height="96" rx="3"/>
  <rect class="s-headline" x="28" y="22" width="104" height="9" rx="2"/>
  <rect class="s-photo" x="28" y="38" width="56" height="44" rx="2"/>
  <path class="d-track" pathLength="1" d="M56 60 L36 44 M56 60 L78 46 M56 60 L70 78"/>
  <path class="d-lepton" pathLength="1" d="M56 60 L34 76"/>
  <path class="s-lines" d="M92 42 h40 M92 50 h40 M92 58 h40 M92 66 h32 M92 74 h40 M28 92 h104 M28 99 h84"/>
{{- else if eq $k "network" }}
  {{- /* a globe with linked points: a worldwide network of people */}}
  <circle class="s-globe" cx="80" cy="60" r="46"/>
  <ellipse class="s-meridian" cx="80" cy="60" rx="20" ry="46"/>
  <path class="s-meridian" d="M34 60 H126 M40 36 H120 M40 84 H120"/>
  <path class="d-track" pathLength="1" d="M52 40 Q 80 20 110 44 M110 44 Q 118 70 92 92 M92 92 Q 60 96 52 40 M52 40 L92 92"/>
  <circle class="d-burst" cx="52" cy="40" r="4"/><circle class="d-burst" cx="110" cy="44" r="4"/><circle class="d-burst" cx="92" cy="92" r="4"/><circle class="d-point" cx="70" cy="64" r="3"/>
{{- else if eq $k "crystals" }}
  {{- /* scintillating crystals: a particle hits one, it glows, a light sensor at the back sends a pulse */}}
  <path class="d-ecal" d="M24 30 L58 24 L58 92 L24 86 Z"/>
  <path class="d-ecal" d="M60 24 L94 24 L94 92 L60 92 Z"/>
  <path class="d-ecal" d="M96 24 L130 30 L130 86 L96 92 Z"/>
  <path class="d-cut" d="M58 24 L58 92 M96 24 L96 92"/>
  <path class="d-track" pathLength="1" d="M4 58 L76 58"/>
  <circle class="d-burst" cx="78" cy="58" r="7" opacity=".9"/>
  <path class="d-photon" d="M84 52 L92 44 M86 58 L94 58 M84 64 L92 72"/>
  <rect class="s-part" x="130" y="48" width="12" height="20" rx="2"/>
  <path class="s-cable" d="M142 58 L148 58 L148 104"/>
  <path class="d-track" pathLength="1" d="M108 104 L126 104 L130 96 L134 104 L152 104"/>
{{- else if eq $k "lar" }}
  {{- /* liquid-argon calorimeter: a cold vessel with accordion-shaped plates and a particle shower */}}
  <rect class="d-vessel" x="12" y="16" width="136" height="88" rx="14"/>
  <path class="s-wire" d="M30 28 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 M54 28 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 M78 28 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 M102 28 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8 l10 8 l-10 8"/>
  <path class="d-track" pathLength="1" d="M0 60 L60 60"/>
  <path class="d-jet" d="M60 60 L120 44 L120 76 Z"/>
  <path class="d-jet-track" pathLength="1" d="M60 60 L118 48 M60 60 L120 60 M60 60 L118 72"/>
{{- else if eq $k "gas" }}
  {{- /* a gas chamber: electrode plates with a thin gas gap, a muon crossing and an avalanche of charge */}}
  <rect class="d-magnet" x="14" y="30" width="132" height="10" rx="2"/>
  <rect class="d-muon-band" x="14" y="44" width="132" height="12" rx="1" opacity=".55"/>
  <rect class="d-magnet" x="14" y="60" width="132" height="10" rx="2"/>
  <rect class="d-muon-band" x="14" y="74" width="132" height="12" rx="1" opacity=".55"/>
  <rect class="d-magnet" x="14" y="90" width="132" height="10" rx="2"/>
  <path class="d-lepton" pathLength="1" d="M52 4 L100 116"/>
  <path class="d-dep-e" d="M66 44 L74 56 L60 56 Z M79 74 L87 86 L73 86 Z"/>
  <path class="s-cable" d="M146 80 L154 80 L154 110"/>
  <path class="d-track" pathLength="1" d="M116 110 L134 110 L138 102 L142 110 L156 110"/>
{{- else if eq $k "sipm" }}
  {{- /* a scintillator tile with a light-guiding fibre read out by a tiny SiPM */}}
  <rect class="d-snd" x="10" y="34" width="100" height="54" rx="3"/>
  <path class="d-hidden" d="M18 61 C 40 46, 62 76, 84 61 S 104 56, 124 61"/>
  <path class="d-track" pathLength="1" d="M46 6 L60 116"/>
  <circle class="d-burst" cx="53" cy="61" r="5"/>
  <path class="d-photon" d="M57 57 L66 52 M57 65 L66 70 M49 57 L40 52"/>
  <rect class="s-part" x="124" y="53" width="14" height="16" rx="2"/>
  <path class="s-cable" d="M138 61 L148 61 L148 100"/>
  <path class="d-track" pathLength="1" d="M112 100 L130 100 L134 92 L138 100 L154 100"/>
{{- else if eq $k "calo" }}
  {{- /* calorimetry: a particle showers in a stack of absorber and light-producing layers; a light sensor reads it out */}}
  <rect class="d-snd" x="22" y="26" width="104" height="70" rx="3"/>
  <path class="s-wire" d="M40 30 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7 M64 30 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7 M88 30 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7 l8 7 l-8 7"/>
  <path class="d-track" pathLength="1" d="M0 61 L40 61"/>
  <path class="d-jet" d="M40 61 L108 42 L108 80 Z"/>
  <path class="d-jet-track" pathLength="1" d="M40 61 L106 46 M40 61 L108 61 M40 61 L106 76"/>
  <circle class="d-burst" cx="72" cy="61" r="4"/>
  <rect class="s-part" x="126" y="51" width="12" height="20" rx="2"/>
  <path class="s-cable" d="M138 61 L148 61 L148 104"/>
  <path class="d-track" pathLength="1" d="M110 104 L128 104 L132 96 L136 104 L154 104"/>
{{- else if eq $k "silicon" }}
  {{- /* silicon tracker: layers of strip sensors, a curved track leaving a hit in each */}}
  <g class="d-tracker-line">
    <path d="M30 20 L30 100 M62 20 L62 100 M94 20 L94 100 M126 20 L126 100"/>
  </g>
  <rect class="d-vessel" x="26" y="20" width="8" height="80" rx="1"/>
  <rect class="d-vessel" x="58" y="20" width="8" height="80" rx="1"/>
  <rect class="d-vessel" x="90" y="20" width="8" height="80" rx="1"/>
  <rect class="d-vessel" x="122" y="20" width="8" height="80" rx="1"/>
  <path class="d-tracker" d="M26 30 h8 M26 40 h8 M26 50 h8 M26 60 h8 M26 70 h8 M26 80 h8 M26 90 h8 M58 30 h8 M58 40 h8 M58 50 h8 M58 60 h8 M58 70 h8 M58 80 h8 M58 90 h8 M90 30 h8 M90 40 h8 M90 50 h8 M90 60 h8 M90 70 h8 M90 80 h8 M90 90 h8 M122 30 h8 M122 40 h8 M122 50 h8 M122 60 h8 M122 70 h8 M122 80 h8 M122 90 h8"/>
  <path class="d-track" pathLength="1" d="M4 90 Q 80 78 156 30"/>
  <circle class="d-burst" cx="30" cy="84.8" r="3.5"/>
  <circle class="d-burst" cx="62" cy="75.6" r="3.5"/>
  <circle class="d-burst" cx="94" cy="63.2" r="3.5"/>
  <circle class="d-burst" cx="126" cy="47.5" r="3.5"/>
{{- else if eq $k "electronics" }}
  {{- /* a small amplifier circuit: transistor, resistors and a pulse */}}
  <path class="s-wire" d="M10 60 L40 60 M40 40 L40 80 M40 52 L58 40 L58 20 L150 20 M40 68 L58 80 L58 100 L150 100 M100 20 L100 34 M100 54 L100 100"/>
  <rect class="s-part" x="94" y="34" width="12" height="20" rx="2"/>
  <path class="s-arrow-em" d="M50 76 L58 80 L52 72"/>
  <path class="d-track" pathLength="1" d="M112 70 L120 70 L124 50 L128 70 L146 70"/>
  <circle class="d-point" cx="10" cy="60" r="3"/>
{{- else if eq $k "physics" }}
  <circle class="s-ring" cx="80" cy="60" r="44"/>
  <path class="d-track" pathLength="1" d="M80 60 Q 100 40 126 30"/>
  <path class="d-track" pathLength="1" d="M80 60 Q 60 82 40 96"/>
  <path class="d-lepton" pathLength="1" d="M80 60 Q 110 70 140 92"/>
  <path class="d-jet-track" pathLength="1" d="M80 60 L52 24 M80 60 L60 22 M80 60 L46 32"/>
  <circle class="d-point" cx="80" cy="60" r="3"/>
{{- else if eq $k "running" }}
  <path class="s-mountain" d="M4 104 L46 50 L70 74 L104 28 L156 104 Z"/>
  <path class="d-track" pathLength="1" d="M10 100 C 40 96 40 70 60 72 S 90 50 104 32"/>
  <circle class="d-point" cx="104" cy="32" r="3"/>
{{- else if eq $k "music" }}
  {{- range $i, $h := slice 30 52 40 70 46 62 34 76 50 58 38 66 44 28 }}
  <rect class="s-bar" x="{{ add 12 (mul $i 10) }}" y="{{ sub 100 $h }}" width="6" height="{{ $h }}" rx="2"/>
  {{- end }}
{{- else }}
  <path class="s-page" d="M40 10 h60 l20 20 v80 h-80 z"/>
  <path class="s-wire" d="M54 46 h52 M54 60 h52 M54 74 h36"/>
{{- end }}
</svg>
