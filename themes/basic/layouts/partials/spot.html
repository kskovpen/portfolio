{{- /* Small original illustrations ("spots") in the style of the experiment drawings.
       {{ partial "spot.html" "courses" }}. Keys: courses, students, schools, public, talks,
       electronics, physics, running, music, travel, generic. Colours follow the theme. */ -}}
{{- $k := . }}
<svg class="spot drawing" viewBox="0 0 160 120" aria-hidden="true">
{{- if eq $k "courses" }}
  {{- /* a blackboard with a Feynman diagram and an equation */}}
  <rect class="s-board" x="10" y="14" width="140" height="84" rx="4"/>
  <rect class="s-frame" x="10" y="14" width="140" height="84" rx="4"/>
  <path class="s-chalk" pathLength="1" d="M30 36 L52 56 L30 76 M52 56 L84 56 M84 56 L106 36 M84 56 L106 76"/>
  <path class="s-chalk-wave" d="M52 56 q4 -6 8 0 t8 0 t8 0 t8 0"/>
  <text class="s-text" x="112" y="60">= ?</text>
  <path class="s-leg" d="M40 98 L34 112 M120 98 L126 112"/>
{{- else if eq $k "students" }}
  {{- /* a lab bench: a scintillator bar, its light sensor and a pulse on the oscilloscope */}}
  <rect class="s-bench" x="8" y="88" width="144" height="8" rx="2"/>
  <rect class="d-snd" x="16" y="66" width="62" height="16" rx="2"/>
  <rect class="d-magnet" x="78" y="69" width="10" height="10" rx="2"/>
  <path class="s-cable" d="M88 74 C 98 74 98 60 104 56"/>
  <rect class="s-scope" x="100" y="26" width="48" height="40" rx="4"/>
  <path class="d-track" pathLength="1" d="M106 52 L116 52 L119 34 L123 52 L142 52"/>
  <path class="d-lepton" pathLength="1" d="M30 14 L46 82"/>
  <circle class="d-burst" cx="42" cy="66" r="3"/>
{{- else if eq $k "schools" }}
  {{- /* mountains, a lecture tent and a rising particle track: summer schools */}}
  <path class="s-mountain" d="M4 100 L44 46 L64 70 L92 30 L156 100 Z"/>
  <path class="s-snow" d="M84 41 L92 30 L100 41 L95 39 L92 43 L88 39 Z"/>
  <path class="s-tent" d="M58 100 L80 72 L102 100 Z"/>
  <path class="s-tent-door" d="M74 100 L80 88 L86 100 Z"/>
  <path class="d-track" pathLength="1" d="M80 72 Q 104 40 140 18"/>
  <circle class="d-point" cx="80" cy="72" r="2.5"/>
{{- else if eq $k "public" }}
  {{- /* a phone with a particle game and a speech bubble */}}
  <rect class="s-phone" x="20" y="10" width="54" height="100" rx="9"/>
  <rect class="s-screen" x="25" y="20" width="44" height="78" rx="3"/>
  <circle class="d-burst" cx="47" cy="58" r="3"/>
  <path class="d-jet-track" pathLength="1" d="M47 58 L33 34 M47 58 L62 36 M47 58 L60 84"/>
  <path class="d-lepton" pathLength="1" d="M47 58 L30 88"/>
  <path class="s-bubble" d="M90 22 h56 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-34 l-12 12 v-12 h-10 a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z"/>
  <text class="s-text" x="118" y="50" text-anchor="middle">E=mc²</text>
{{- else if eq $k "talks" }}
  {{- /* a projection screen with a plot: data points on top of a prediction, with a bump */}}
  <rect class="s-screen-big" x="12" y="8" width="136" height="80" rx="3"/>
  <path class="s-axis" d="M28 76 L136 76 M28 76 L28 20"/>
  <path class="s-pred" d="M30 70 C 60 66 70 50 80 42 C 88 36 92 56 100 60 C 112 66 124 70 134 72"/>
  {{- range $i, $p := slice (slice 36 68) (slice 46 64) (slice 56 58) (slice 66 52) (slice 76 42) (slice 82 36) (slice 90 48) (slice 100 58) (slice 112 64) (slice 124 69) }}
  <circle class="s-dot" cx="{{ index $p 0 }}" cy="{{ index $p 1 }}" r="2.4"/>
  {{- end }}
  <path class="s-stand" d="M80 88 L80 110 M64 112 L96 112"/>
{{- else if eq $k "electronics" }}
  {{- /* a small amplifier circuit: transistor, resistors and a pulse */}}
  <path class="s-wire" d="M10 60 L40 60 M40 40 L40 80 M40 52 L58 40 L58 20 L150 20 M40 68 L58 80 L58 100 L150 100 M100 20 L100 34 M100 54 L100 100"/>
  <rect class="s-part" x="94" y="34" width="12" height="20" rx="2"/>
  <path class="s-arrow-em" d="M50 76 L58 80 L52 72"/>
  <path class="d-track" pathLength="1" d="M112 70 L120 70 L124 50 L128 70 L146 70"/>
  <circle class="d-point" cx="10" cy="60" r="3"/>
{{- else if eq $k "physics" }}
  <circle class="s-ring" cx="80" cy="60" r="44"/>
  <path class="d-track" pathLength="1" d="M80 60 Q 100 40 126 30"/>
  <path class="d-track" pathLength="1" d="M80 60 Q 60 82 40 96"/>
  <path class="d-lepton" pathLength="1" d="M80 60 Q 110 70 140 92"/>
  <path class="d-jet-track" pathLength="1" d="M80 60 L52 24 M80 60 L60 22 M80 60 L46 32"/>
  <circle class="d-point" cx="80" cy="60" r="3"/>
{{- else if eq $k "running" }}
  <path class="s-mountain" d="M4 104 L46 50 L70 74 L104 28 L156 104 Z"/>
  <path class="d-track" pathLength="1" d="M10 100 C 40 96 40 70 60 72 S 90 50 104 32"/>
  <circle class="d-point" cx="104" cy="32" r="3"/>
{{- else if eq $k "music" }}
  {{- range $i, $h := slice 30 52 40 70 46 62 34 76 50 58 38 66 44 28 }}
  <rect class="s-bar" x="{{ add 12 (mul $i 10) }}" y="{{ sub 100 $h }}" width="6" height="{{ $h }}" rx="2"/>
  {{- end }}
{{- else }}
  <path class="s-page" d="M40 10 h60 l20 20 v80 h-80 z"/>
  <path class="s-wire" d="M54 46 h52 M54 60 h52 M54 74 h36"/>
{{- end }}
</svg>
