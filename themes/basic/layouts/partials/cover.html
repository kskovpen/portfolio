{{- /* Cover image of a page bundle, or nothing. Param: dict "page" "size" */ -}}
{{- with partial "bundle-image.html" (dict "page" .page "key" "cover") }}
  {{- $img := .Fill ($.size | default "600x400 smart webp") }}
  <img class="cover" src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="" loading="lazy">
{{- end }}
