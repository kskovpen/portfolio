<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
  {{ partial "head.html" . }}
  <body>
    <div class="container">
      <div class="top">
        {{ partial "header.html" . }}
        <br>
        {{ partial "nav.html" . }}
        <br>
      </div>
      <main>
      <div id="content">
        {{ block "main" . }}{{ end }}
      </div>
      </main>
      <br><br>
      {{ partial "footer.html" . }}
    </div>
    {{ partial "head/js.html" . }}
  </body>
</html>
