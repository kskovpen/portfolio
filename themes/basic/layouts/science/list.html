{{ define "main" }}
  {{ $css := resources.Get "css/cards.scss" | resources.ExecuteAsTemplate "css/cards.scss" . | toCSS | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <div class="cards container">
    {{ range .Pages }}
      <a class="cards card" href="{{ .RelPermalink }}">
        <p>{{ .Title }}</p>
      </a>
    {{ end }}
  </div>
{{ end }}
