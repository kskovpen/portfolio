baseURL = 'https://kirillskovpen.pages.dev/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Kirill Skovpen'
theme = 'basic'
pygmentsUseClasses = true

[params]
  author = 'Kirill Skovpen'
  # Optional: photo under static/ (e.g. 'images/me.jpg') and CV PDF under static/ (e.g. 'cv.pdf')
  photo = 'images/me.jpg'
  cv = ''
  # SoundCloud profile shown as a player on the Music page
  soundcloud = 'https://soundcloud.com/kirillskovpenmusic'
  soundcloud_user_id = 1402515
  # Personal photos are served from Cloudflare R2 (uploaded by the Write a Post app), never from git
  photos_url = 'https://photos.kirillskovpen.com'

  [[params.profiles]]
    name = 'UGent EPPG'
    url = 'https://eppg.ugent.be/'
  [[params.profiles]]
    name = 'INSPIRE-HEP'
    url = 'https://inspirehep.net/authors/1066490'
  [[params.profiles]]
    name = 'GitHub'
    url = 'https://github.com/kskovpen'
  [[params.profiles]]
    name = 'SoundCloud'
    url = 'https://soundcloud.com/kirillskovpenmusic'
  [[params.profiles]]
    name = 'Instagram'
    url = 'https://www.instagram.com/kirillskovpen/'
  [[params.profiles]]
    name = 'LinkedIn'
    url = 'https://linkedin.com/in/kirill-skovpen-1464a4253'

[permalinks]
  posts = '/posts/:year/:slugorcontentbasename/'

[taxonomies]
  tag = 'tags'

# ---- Languages ----
# English is served at /, the others at /fr/, /nl/, /ru/. Page translations are files with a
# language suffix next to the English one (about.fr.md, index.ru.md, ...); interface text is in themes/basic/i18n/.
# Menu entries with params.needsPages = true stay hidden until their section has at least one page.

[languages.en]
  languageName = 'English'
  languageCode = 'en'
  weight = 1
  [languages.en.params]
    description = "Physicist at Ghent University working with data from the Large Hadron Collider at CERN. Runner, tinkerer."
    role = 'Physicist · Ghent University · CERN'

  [[languages.en.menus.main]]
    identifier = 'research'
    name = 'Research'
    pageRef = '/science'
    weight = 10

  [[languages.en.menus.main]]
    identifier = 'talks'
    name = 'Talks'
    pageRef = '/talks'
    weight = 20

  [[languages.en.menus.main]]
