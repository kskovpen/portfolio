baseURL = 'https://kskovpen.netlify.app/'
languageCode = 'en-us'
title = 'Kirill Skovpen'
theme = 'basic'
pygmentsUseClasses = true

[params]
  author = 'Kirill Skovpen'
  # Used for the meta description and link previews
  description = 'Physicist at Ghent University working with data from the Large Hadron Collider at CERN. Runner, tinkerer.'
  # One-line role shown under the name on the home page
  role = 'Physicist · Ghent University · CERN'
  # Optional: photo under static/ (e.g. 'images/me.jpg') and CV PDF under static/ (e.g. 'cv.pdf')
  photo = 'images/me.jpg'
  cv = ''
  # SoundCloud profile shown as a player on the Music page
  soundcloud = 'https://soundcloud.com/kirillskovpenmusic'
  soundcloud_user_id = 1402515
  # GitHub user whose other public repositories are listed at the bottom of the Projects page
  gh_user = 'kskovpen'

  [[params.profiles]]
    name = 'INSPIRE-HEP'
    url = 'https://inspirehep.net/authors/1066490'
  [[params.profiles]]
    name = 'GitHub'
    url = 'https://github.com/kskovpen'
  [[params.profiles]]
    name = 'SoundCloud'
    url = 'https://soundcloud.com/kirillskovpenmusic'
  [[params.profiles]]
    name = 'LinkedIn'
    url = 'https://linkedin.com/in/kirill-skovpen-1464a4253'

[menus]
  # Entries with params.needsPages = true stay hidden until their section has at least one page.
  [[menus.main]]
    name = 'Research'
    pageRef = '/science'
    weight = 10
  [[menus.main]]
    name = 'Talks'
    pageRef = '/talks'
    weight = 20
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 30
  [[menus.main]]
    name = 'Music'
    pageRef = '/music'
    weight = 40
  [[menus.main]]
    name = 'Travel'
    pageRef = '/travel'
    weight = 50
    [menus.main.params]
      needsPages = true
  [[menus.main]]
    name = 'Running'
    pageRef = '/run'
    weight = 60
  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 70
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 80

[permalinks]
  posts = '/posts/:year/:slugorcontentbasename/'

[taxonomies]
  tag = 'tags'

# GitHub repository list for the Projects page is re-fetched at most once a day locally
[caches.getresource]
  maxAge = '24h'
