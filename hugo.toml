  role = 'Particle physicist · Ghent University · CMS experiment at CERN'
  # Optional: photo under static/ (e.g. 'images/me.jpg') and CV PDF under static/ (e.g. 'cv.pdf')
  photo = ''
  cv = ''
  # GitHub user whose public repositories are listed on the Software page
  gh_user = 'kskovpen'

  [[params.profiles]]
    name = 'INSPIRE-HEP'
    url = 'https://inspirehep.net/authors/1066490'
  [[params.profiles]]
    name = 'GitHub'
    url = 'https://github.com/kskovpen'
  [[params.profiles]]
