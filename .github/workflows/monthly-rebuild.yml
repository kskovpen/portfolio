# Rebuilds the site on Cloudflare Pages once a month so the Run page picks up new Strava activities.
# Needs the repository secret DEPLOY_HOOK (a Cloudflare Pages deploy hook URL).
name: Monthly rebuild

on:
  schedule:
    - cron: "17 4 1 * *"   # 04:17 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: curl -fsS -X POST -d '{}' "$HOOK" > /dev/null
