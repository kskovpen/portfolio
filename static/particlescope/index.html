<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParticleScope</title>
<link rel="icon" href="assets/logo.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; color: #cfd6de; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  #ui { position: fixed; top: 10px; right: 10px; width: 290px; max-height: calc(100% - 20px); overflow-y: auto;
        background: rgba(12,14,18,0.72); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px; padding: 8px 12px 12px; transition: transform .25s, opacity .25s; }
  #ui.hidden { transform: translateX(110%); opacity: 0; pointer-events: none; }
  h1 { font-size: 13px; margin: 4px 0 2px; font-weight: 600; color: #fff; }
  h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #7d8894; margin: 12px 0 4px; }
  .row { display: grid; grid-template-columns: 1fr 92px 64px; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
  .row:has(input[type=checkbox]) { grid-template-columns: 18px 1fr; }
  .row input[type=range] { width: 100%; accent-color: #8fc8ff; }
  .row input[type=checkbox] { accent-color: #8fc8ff; margin: 0; }
  .val { text-align: right; color: #9aa6b2; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11px; }
  details summary { cursor: pointer; color: #9aa6b2; margin-top: 12px; font-size: 11px; }
  .hint { color: #6c7682; font-size: 11px; margin-top: 10px; }
  #stats { position: fixed; left: 12px; bottom: 10px; color: #6c7682; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #scale { position: fixed; left: 12px; bottom: 28px; color: #8a949e; font-size: 11px; pointer-events: none; }
  #scalebar { display: inline-block; height: 3px; border: 1px solid #8a949e; border-top: none; vertical-align: middle; margin-right: 6px; }
  #dims { color: #5f6973; font-size: 10px; margin-top: 2px; }
  #bar { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); }
  #home { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(ellipse at 50% 30%, rgba(8,10,14,0.55), rgba(0,0,0,0.88));
          backdrop-filter: blur(3px); padding: 6vh 16px 40px; box-sizing: border-box; transition: opacity .35s; z-index: 5; }
  #home.hidden { opacity: 0; pointer-events: none; }
  #home .brand { text-align: center; margin-bottom: 28px; }
  #home h2 { font-size: 30px; font-weight: 600; letter-spacing: .02em; color: #fff; margin: 0 0 6px; }
  #home .brand p { color: #9aa6b2; margin: 0; font-size: 14px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; max-width: 1040px; margin: 0 auto; }
  .card { background: rgba(16,19,24,0.82); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; overflow: hidden; cursor: pointer;
          text-align: left; color: inherit; font: inherit; padding: 0; transition: transform .15s, border-color .15s; }
  .card:hover:not(.soon) { transform: translateY(-3px); border-color: rgba(143,200,255,0.55); }
  .card svg { display: block; width: 100%; height: auto; background: #050608; }
  .card .t { padding: 10px 14px 14px; }
  .card .y { color: #8fc8ff; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .card b { display: block; color: #fff; font-size: 14px; margin: 3px 0 4px; }
  .card span.d { color: #9aa6b2; font-size: 12px; line-height: 1.4; }
  .card.soon { opacity: .45; cursor: default; }
  #splash { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .6s; cursor: pointer; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { width: 132px; height: 132px; animation: pop 1s ease-out both; }
  #splash .name { font-size: 34px; font-weight: 600; letter-spacing: .03em; color: #fff; animation: rise .8s .5s ease-out both; }
  #splash .name span { color: #8fc8ff; }
  #splash .sub { color: #8a949e; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; animation: rise .8s .8s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: scale(.7) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #home h2 img { width: 34px; height: 34px; vertical-align: -6px; margin-right: 10px; }
  #story { position: fixed; inset: 0; z-index: 8; overflow-y: auto; background: rgba(0,0,0,0.9); backdrop-filter: blur(6px); padding: 5vh 16px 40px; box-sizing: border-box; transition: opacity .3s; }
  #story.hidden { opacity: 0; pointer-events: none; }
  #story .in { max-width: 680px; margin: 0 auto; }
  #story h3 { color: #fff; font-size: 14px; margin: 22px 0 8px; text-transform: none; letter-spacing: 0; }
  #story ol { color: #cfd6de; font-size: 13px; line-height: 1.55; padding-left: 18px; margin: 0 0 10px; }
  #story ul { color: #cfd6de; font-size: 13px; line-height: 1.55; padding-left: 18px; margin: 0 0 10px; }
  #story li { margin-bottom: 6px; }
  #story a { color: #8fc8ff; }
  #story p.small { font-size: 12px; color: #9aa6b2; }
  #home .foot { text-align: center; margin-top: 26px; }
  #home .foot button { background: none; border: none; color: #7d8894; font: 12px system-ui, sans-serif; cursor: pointer; text-decoration: underline; }
  #story .y { color: #8fc8ff; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  #story h2 { color: #fff; font-size: 26px; font-weight: 600; margin: 6px 0 4px; }
  #story .who { color: #9aa6b2; font-size: 13px; margin-bottom: 18px; }
  #story .figs { display: flex; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
  #story figure { margin: 0; flex: 1 1 260px; }
  #story figure img { width: 100%; height: 240px; object-fit: cover; object-position: 50% 20%; border-radius: 8px; display: block; filter: grayscale(1) contrast(1.05); }
  #story figure img.color { filter: none; }
  #story figure img.drawing { object-fit: contain; background: #f2efe6; filter: none; }
  #story figure.sch svg { width: 100%; height: 240px; display: block; background: #05070a; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; }
  #story figcaption { color: #6c7682; font-size: 11px; margin-top: 6px; }
  #story p { color: #cfd6de; font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  #story em { color: #fff; font-style: normal; font-weight: 600; }
  #story .go { display: flex; gap: 10px; margin-top: 22px; }
  #story button { border-radius: 22px; padding: 10px 22px; font: 14px system-ui, sans-serif; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: none; color: #cfd6de; }
  #story button.start { background: #8fc8ff; color: #06121f; border-color: #8fc8ff; font-weight: 600; }
  #expose, #home-btn, #snd { background: rgba(12,14,18,0.7); color: #cfd6de; border: 1px solid rgba(255,255,255,0.18); border-radius: 18px;
              padding: 7px 16px; font: 12px system-ui, sans-serif; cursor: pointer; backdrop-filter: blur(6px); }
  #caption { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); display: none;
             background: rgba(12,14,18,0.78); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(8px); }
  #caption.show { display: block; }
  #caption .who { color: #8a949e; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
  #caption b { display: block; color: #fff; font-size: 13px; margin: 3px 0 4px; }
  #caption p { margin: 0; color: #c3ccd5; font-size: 12px; line-height: 1.45; }
  #caption .sim { margin-top: 6px; color: #6c7682; font-size: 10px; }
  #caption { cursor: pointer; }
  #caption.mini p, #caption.mini .sim { display: none; }
  #caption.mini b { margin-bottom: 0; }
  #caption .x { position: absolute; top: 4px; right: 8px; background: none; border: none; color: #8a949e; font-size: 15px; cursor: pointer; }
  #scbar button, #pxbar button, #rfbar button { background: rgba(12,14,18,0.7); color: #cfd6de; border: 1px solid rgba(255,255,255,0.18); border-radius: 16px; padding: 7px 11px; font: 12px system-ui, sans-serif; cursor: pointer; }
  #scbar button.on, #pxbar button.on, #rfbar button.on { background: rgba(143,200,255,0.22); border-color: #8fc8ff; color: #fff; }
  #expose.on { background: rgba(143,200,255,0.22); border-color: #8fc8ff; color: #fff; }
  #legend { position: fixed; left: 12px; top: 10px; background: rgba(12,14,18,0.6); border-radius: 8px; padding: 6px 10px; display: none; pointer-events: none; }
  #legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #err { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f88; font-size: 15px; pointer-events: none; padding: 20px; text-align: center; }
  #show { position: fixed; top: 10px; right: 10px; background: rgba(12,14,18,0.6); color: #cfd6de; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  @media (max-width: 520px) { #ui { width: calc(100% - 44px); } }
  @media (max-width: 640px) {
    #bar { gap: 6px; } #bar button { padding: 6px 10px !important; font-size: 11px !important; }
    #home { padding-top: 4vh; } #home h2 { font-size: 24px; } #home .brand p { font-size: 12px; }
    #caption { top: calc(8px + env(safe-area-inset-top)); } #caption p { font-size: 11px; }
    #legend { font-size: 10px; } #scale, #stats { display: none; }
    #story { padding-top: calc(3vh + env(safe-area-inset-top)); } #story h2 { font-size: 21px; } #story p { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2" style="position:fixed;inset:0;width:100%;height:100%;display:none"></canvas>
<button id="show" onclick="document.getElementById('ui').classList.remove('hidden')">☰</button>
<div id="ui">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h1>ParticleScope</h1>
    <button id="toggle" style="position:static;z-index:auto;background:none;border:none;color:#9aa6b2;cursor:pointer;font-size:14px">✕</button>
  </div>
  <div id="controls"></div>
  <div class="hint">Drag to tilt · scroll to zoom · Space pause · F fullscreen</div>
</div>
<div id="legend">
  <div><span style="background:#40bfff"></span>muon</div>
  <div><span style="background:#59ff59"></span>electron</div>
  <div><span style="background:#ffef40"></span>δ-ray</div>
  <div><span style="background:#ff8026"></span>alpha</div>
  <div><span style="background:#ff40cc"></span>proton</div>
  <div><span style="background:#ff5252"></span>positron</div>
  <div><span style="background:#b88cff"></span>pion</div>
  <div><span style="background:#4dffd9"></span>kaon</div>
</div>
<div id="bar">
  <button id="home-btn" title="Back to the experiments menu">◂ Experiments</button>
  <button id="snd" title="Mute detector sounds">🔊</button>
  <button id="expose" title="Colour every track by particle type (E)">Expose</button>
  <span id="scbar" style="display:none;gap:6px"><button data-s="cs137" class="on">Cs-137</button><button data-s="co60">Co-60</button><button data-v="1" class="on">×1</button><button data-v="10">×10</button><button data-v="100">×100</button><button data-v="real">real time</button></span>
  <span id="pxbar" style="display:none;gap:6px"><button data-s="background">Background</button><button data-s="am241">Am-241</button><button data-s="sr90">Sr-90</button><button data-s="space">Space Station</button></span>
  <span id="rfbar" style="display:none;gap:6px"><button data-s="1">×1</button><button data-s="10">×10</button><button data-s="100">×100</button><button data-s="1000">×1000</button></span>
</div>
<div id="home">
  <div class="brand"><h2><img src="assets/logo.svg" alt="">ParticleScope</h2><p>See the invisible. Watch the experiments that uncovered the particle world, simulated with real physics.</p></div>
  <div id="cards"></div>
  <div class="foot"><button id="credits-btn">About &amp; credits</button></div>
</div>
<div id="caption"></div>
<div id="story" class="hidden"><div class="in"></div></div>
<div id="splash"><img src="assets/logo.svg" alt=""><div class="name">Particle<span>Scope</span></div><div class="sub">See the invisible</div></div>
<div id="scale"><div id="scalebar"></div><span id="scalelbl"></span><div id="dims"></div></div>
<div id="stats"></div>
<div id="err"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
