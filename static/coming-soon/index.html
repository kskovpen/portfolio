<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirill Skovpen</title>
<meta name="description" content="Kirill Skovpen, physicist at Ghent University. Website coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='21' font-family='Helvetica,Arial' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3EKS%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #fafaf8; --fg: #141414; --muted: #6b6b6b; --line: #dcdcd6; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #ececea; --muted: #9a9a96; --line: #2c2c2a; --accent: #fb923c; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main { width: min(560px, 100%); border: 1px solid var(--line); padding: 48px 40px; }
  .mark {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    background: var(--fg); color: var(--bg); font-weight: 700; letter-spacing: .02em; margin-bottom: 32px;
  }
  h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.05; letter-spacing: -.02em; font-weight: 700; }
  .role { color: var(--muted); margin-top: 10px; }
  .soon {
    margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; font-size: 15px;
  }
  .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  @media (max-width: 480px) { main { padding: 36px 24px; } }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">KS</div>
  <h1>Kirill Skovpen</h1>
  <p class="role">Physicist · Ghent University · CMS experiment at CERN</p>
  <p class="soon"><span class="dot" aria-hidden="true"></span>New website coming soon.</p>
</main>
</body>
</html>
