[build]
  command = "./build.sh"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.148.1"
  NODE_VERSION = "22"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Placeholder on the custom domain until the site is announced;
# the full site stays on kskovpen.netlify.app.
[[redirects]]
  from = "https://www.kirillskovpen.com/*"
  to = "/coming-soon/index.html"
  status = 200
  force = true

[[redirects]]
  from = "http://www.kirillskovpen.com/*"
  to = "/coming-soon/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://kirillskovpen.com/*"
  to = "https://www.kirillskovpen.com/"
  status = 301
  force = true
